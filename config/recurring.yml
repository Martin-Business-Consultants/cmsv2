# Solid Queue recurring schedule: fixed jobs that always run, plus what
# enabled plugins ask for (Cms::Plugins.minutely, .nightly).
production:
  scheduled_publishing:
    class: ProcessScheduledPublishingJob
    queue: default
    schedule: every minute
  # Every enabled plugin's minutely tasks (Cms::Plugins.minutely).
  plugins_minutely:
    class: PluginsMinutelyJob
    queue: default
    schedule: every minute
  # The trash, past its 30 days.
  trash_purge:
    class: TrashPurgeJob
    queue: default
    schedule: every day at 3am
  # Every enabled plugin's nightly task (Cms::Plugins.nightly).
  plugins_nightly:
    class: PluginsNightlyJob
    queue: default
    schedule: every day at 1am
  # Is there a newer CMS release (Settings › Updates)? Also settles an update
  # that finished or went quiet. CMS_UPDATE_CHECK=false skips the check.
  update_check:
    class: UpdateCheckJob
    queue: default
    schedule: every day at 4am
